alerts:
  - name: high-error-rate
    severity: critical
    condition: error_rate_pct > 2 for 5m
    type: symptom-based
    owner: on-call-api
    runbook: docs/alerts.md#alert-1
  - name: high-p95-latency
    severity: warning
    condition: latency_p95_ms > 3000 for 10m
    type: symptom-based
    owner: on-call-api
    runbook: docs/alerts.md#alert-2
  - name: low-quality-proxy
    severity: warning
    condition: quality_score_avg < 0.75 for 15m
    type: symptom-based
    owner: ai-platform
    runbook: docs/alerts.md#alert-3
